<script>
(function () {
  // --- Constants ---
  const STAGE_PROB_MAP = {
    'Lead': 0.10,
    'Viewing': 0.25,
    'Offer': 0.50,
    'Under Offer': 0.75,
    'Closed': 1.00
  };
  const STAGES = ['Lead', 'Viewing', 'Offer', 'Under Offer', 'Closed'];
  const NUM_ITERATIONS = 500;
  const BATCH_SIZE = 50;

  // --- State ---
  let deals = [];
  let lastResult = null;
  let dealIdCounter = 0;

  // --- Pure Functions ---

  function createDefaultDeal() {
    return {
      id: ++dealIdCounter,
      propertyValue: 1500000,
      commissionRate: 5,
      stage: 'Lead'
    };
  }

  function getDealCommission(deal) {
    return deal.propertyValue * (deal.commissionRate / 100);
  }

  function getDealProbability(stage) {
    return STAGE_PROB_MAP[stage] || 0.10;
  }

  function validate(inputs) {
    const errors = [];
    if (!inputs.deals || inputs.deals.length === 0) {
      errors.push('Add at least one deal');
    }
    inputs.deals.forEach((d, i) => {
      if (!d.propertyValue || d.propertyValue < 1) errors.push(`Deal ${i + 1}: invalid property value`);
      if (!d.commissionRate || d.commissionRate < 0) errors.push(`Deal ${i + 1}: invalid commission rate`);
    });
    return { valid: errors.length === 0, errors };
  }

  function calculate(inputs) {
    const outcomes = [];
    const commissionPerDeal = inputs.deals.map(d => getDealCommission(d));
    const probabilityPerDeal = inputs.deals.map(d => getDealProbability(d.stage));

    for (let iter = 0; iter < NUM_ITERATIONS; iter++) {
      let totalCommission = 0;
      for (let i = 0; i < inputs.deals.length; i++) {
        if (Math.random() < probabilityPerDeal[i]) {
          totalCommission += commissionPerDeal[i];
        }
      }
      outcomes.push(totalCommission - inputs.operatingCosts);
    }

    outcomes.sort((a, b) => a - b);

    const min = outcomes[0];
    const max = outcomes[NUM_ITERATIONS - 1];
    const range = max - min || 1;
    const bucketCount = 10;
    const buckets = new Array(bucketCount).fill(0);
    const bucketLabels = [];

    for (let i = 0; i < bucketCount; i++) {
      const lower = min + (range * i / bucketCount);
      const upper = min + (range * (i + 1) / bucketCount);
      bucketLabels.push(toolFormatZAR(Math.round(lower)) + ' - ' + toolFormatZAR(Math.round(upper)));
    }

    for (const val of outcomes) {
      const idx = Math.min(bucketCount - 1, Math.floor((val - min) / range * bucketCount));
      buckets[idx]++;
    }

    const totalPipelineValue = inputs.deals.reduce((sum, d) => sum + d.propertyValue, 0);
    const weightedCommission = inputs.deals.reduce((sum, d) => sum + getDealCommission(d) * getDealProbability(d.stage), 0);

    return {
      worst: outcomes[Math.floor(0.05 * NUM_ITERATIONS)],
      likely: outcomes[Math.floor(0.50 * NUM_ITERATIONS)],
      best: outcomes[Math.floor(0.95 * NUM_ITERATIONS)],
      buckets,
      bucketLabels,
      outcomes,
      totalPipelineValue,
      weightedCommission: Math.round(weightedCommission),
      negativeRisk: outcomes[Math.floor(0.05 * NUM_ITERATIONS)] < 0,
      dealCount: inputs.deals.length,
      operatingCosts: inputs.operatingCosts,
      deals: inputs.deals.map(d => ({
        ...d,
        commission: getDealCommission(d),
        probability: getDealProbability(d.stage)
      }))
    };
  }

  // --- DOM: Get Inputs ---

  function getInputs() {
    return {
      deals: deals.map(d => ({ ...d })),
      operatingCosts: parseInt(document.getElementById('input-operatingCosts').value)
    };
  }

  // --- DOM: Render ---

  function renderDeals() {
    const container = document.getElementById('deals-container');
    container.innerHTML = '';

    deals.forEach((deal, index) => {
      const commission = getDealCommission(deal);
      const prob = getDealProbability(deal.stage);
      const div = document.createElement('div');
      div.className = 'deal-row border border-outline-variant p-md bg-surface-container';

      div.innerHTML = `
        <div class="flex justify-between items-center mb-sm">
          <p class="text-code-snippet text-primary font-bold">DEAL ${index + 1}</p>
          ${deals.length > 1 ? `<button class="remove-btn text-secondary-container text-code-snippet bg-transparent border-none cursor-pointer hover:opacity-70" data-deal-id="${deal.id}">✕ REMOVE</button>` : ''}
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-md">
          <div>
            <label class="text-code-snippet text-on-surface-variant block mb-xs">Property Value</label>
            <input type="range" min="500000" max="10000000" value="${deal.propertyValue}" step="50000"
              class="w-full deal-prop-val" data-deal-id="${deal.id}" />
            <span class="text-code-snippet text-primary deal-prop-display" data-deal-id="${deal.id}">${toolFormatZAR(deal.propertyValue)}</span>
          </div>
          <div>
            <label class="text-code-snippet text-on-surface-variant block mb-xs">Commission Rate</label>
            <input type="range" min="2" max="10" value="${deal.commissionRate}" step="0.5"
              class="w-full deal-rate" data-deal-id="${deal.id}" />
            <span class="text-code-snippet text-primary deal-rate-display" data-deal-id="${deal.id}">${deal.commissionRate}%</span>
          </div>
          <div>
            <label class="text-code-snippet text-on-surface-variant block mb-xs">Stage</label>
            <select class="deal-stage w-full" data-deal-id="${deal.id}">
              ${STAGES.map(s => `<option value="${s}" ${s === deal.stage ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-code-snippet text-on-surface-variant block mb-xs">Probability</label>
            <p class="text-body-sm text-on-surface font-bold deal-prob-display" data-deal-id="${deal.id}">${(prob * 100).toFixed(0)}%</p>
          </div>
        </div>
        <div class="mt-sm text-right">
          <span class="text-code-snippet text-on-surface-variant">Commission: </span>
          <span class="text-body-sm text-primary font-bold deal-commission-display" data-deal-id="${deal.id}">${toolFormatZAR(commission)}</span>
        </div>
      `;

      container.appendChild(div);
    });

    wireDealEvents();
    updateDealCount();
  }

  function updateDealDisplay(dealId) {
    const deal = deals.find(d => d.id === dealId);
    if (!deal) return;

    const els = {
      propDisplay: document.querySelector(`.deal-prop-display[data-deal-id="${dealId}"]`),
      rateDisplay: document.querySelector(`.deal-rate-display[data-deal-id="${dealId}"]`),
      probDisplay: document.querySelector(`.deal-prob-display[data-deal-id="${dealId}"]`),
      commDisplay: document.querySelector(`.deal-commission-display[data-deal-id="${dealId}"]`),
      propInput: document.querySelector(`.deal-prop-val[data-deal-id="${dealId}"]`),
      rateInput: document.querySelector(`.deal-rate[data-deal-id="${dealId}"]`)
    };

    if (els.propDisplay) els.propDisplay.textContent = toolFormatZAR(deal.propertyValue);
    if (els.rateDisplay) els.rateDisplay.textContent = deal.commissionRate + '%';
    if (els.probDisplay) els.probDisplay.textContent = (getDealProbability(deal.stage) * 100).toFixed(0) + '%';
    if (els.commDisplay) els.commDisplay.textContent = toolFormatZAR(getDealCommission(deal));
    if (els.propInput) els.propInput.value = deal.propertyValue;
    if (els.rateInput) els.rateInput.value = deal.commissionRate;
  }

  function updateDealCount() {
    document.getElementById('deal-count').textContent = deals.length + ' / 10 deals';
  }

  function displayResults(result) {
    lastResult = result;

    // Risk indicator
    const riskBox = document.getElementById('risk-indicator-box');
    riskBox.classList.toggle('hidden', !result.negativeRisk);

    // Animate counters
    toolAnimateValue(document.getElementById('result-worst'), 0, result.worst, 1200, 'R');
    toolAnimateValue(document.getElementById('result-likely'), 0, result.likely, 1200, 'R');
    toolAnimateValue(document.getElementById('result-best'), 0, result.best, 1200, 'R');

    // Distribution chart
    const distContainer = document.getElementById('distribution-container');
    const maxBucket = Math.max(...result.buckets);
    distContainer.innerHTML = result.buckets.map((count, i) => {
      const pct = maxBucket > 0 ? (count / maxBucket * 100) : 0;
      return `
        <div>
          <div class="flex justify-between text-code-snippet mb-xs">
            <span class="text-on-surface-variant text-[10px]">${result.bucketLabels[i]}</span>
            <span class="text-primary">${count}</span>
          </div>
          <div class="h-2 bg-surface-container-highest overflow-hidden">
            <div class="h-full dist-bar bg-primary" style="width:0%"></div>
          </div>
        </div>
      `;
    }).join('');

    requestAnimationFrame(() => {
      const bars = distContainer.querySelectorAll('.dist-bar');
      result.buckets.forEach((count, i) => {
        const pct = maxBucket > 0 ? (count / maxBucket * 100) : 0;
        setTimeout(() => { bars[i].style.width = pct + '%'; }, 100 + i * 100);
      });
    });

    // Summary stats
    document.getElementById('result-total-pipeline').textContent = toolFormatZAR(result.totalPipelineValue);
    document.getElementById('result-weighted').textContent = toolFormatZAR(result.weightedCommission);
    document.getElementById('result-costs').textContent = toolFormatZAR(result.operatingCosts);
    document.getElementById('result-deal-count').textContent = result.dealCount;

    // Deal breakdown table
    const tbody = document.getElementById('deal-breakdown-body');
    tbody.innerHTML = result.deals.map((d, i) => `
      <tr class="border-b border-outline-variant/50">
        <td class="py-sm pr-sm text-on-surface-variant">${i + 1}</td>
        <td class="py-sm pr-sm text-on-surface">${toolFormatZAR(d.propertyValue)}</td>
        <td class="py-sm pr-sm text-on-surface">${d.commissionRate}%</td>
        <td class="py-sm pr-sm text-primary font-bold">${toolFormatZAR(d.commission)}</td>
        <td class="py-sm pr-sm text-on-surface">${d.stage}</td>
        <td class="py-sm pr-sm text-primary">${(d.probability * 100).toFixed(0)}%</td>
      </tr>
    `).join('');
  }

  // --- DOM: Screens ---

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => {
      s.classList.remove('active');
      s.classList.add('hidden');
    });
    const el = document.getElementById(id);
    el.classList.remove('hidden');
    el.classList.add('active');
  }

  // --- DOM: Processing Animation ---

  function runProcessing(inputs, callback) {
    const msgContainer = document.getElementById('processing-messages');
    const bar = document.getElementById('processing-bar');
    const pct = document.getElementById('processing-pct');
    const iterEl = document.getElementById('processing-iteration');
    msgContainer.innerHTML = '<p class="text-code-snippet text-on-surface-variant">&gt; Running Monte Carlo simulation...</p>';
    bar.style.width = '0%';
    pct.textContent = '0%';
    iterEl.textContent = '0';

    const commissionPerDeal = inputs.deals.map(d => getDealCommission(d));
    const probabilityPerDeal = inputs.deals.map(d => getDealProbability(d.stage));
    const allOutcomes = [];
    let completed = 0;

    const messages = [
      '> Running Monte Carlo simulation...',
      '> Simulating deal outcomes...',
      '> Aggregating distribution buckets...',
      '> Computing percentile values...',
      '> Finalizing forecast report...'
    ];

    function nextBatch() {
      const batchEnd = Math.min(completed + BATCH_SIZE, NUM_ITERATIONS);
      for (let i = completed; i < batchEnd; i++) {
        let totalCommission = 0;
        for (let j = 0; j < inputs.deals.length; j++) {
          if (Math.random() < probabilityPerDeal[j]) {
            totalCommission += commissionPerDeal[j];
          }
        }
        allOutcomes.push(totalCommission - inputs.operatingCosts);
      }
      completed = batchEnd;

      const pctDone = Math.round((completed / NUM_ITERATIONS) * 100);
      bar.style.width = pctDone + '%';
      pct.textContent = pctDone + '%';
      iterEl.textContent = completed;

      const msgIdx = Math.min(Math.floor(completed / (NUM_ITERATIONS / messages.length)), messages.length - 1);
      msgContainer.innerHTML = '<p class="text-code-snippet text-on-surface-variant">' + messages[msgIdx] + '</p>';

      if (completed < NUM_ITERATIONS) {
        setTimeout(nextBatch, 100);
      } else {
        setTimeout(() => {
          bar.style.width = '100%';
          pct.textContent = '100%';
          iterEl.textContent = NUM_ITERATIONS;

          allOutcomes.sort((a, b) => a - b);
          const result = buildResult(inputs, allOutcomes);
          callback(result);
        }, 400);
      }
    }

    nextBatch();
  }

  function buildResult(inputs, outcomes) {
    const min = outcomes[0];
    const max = outcomes[NUM_ITERATIONS - 1];
    const range = max - min || 1;
    const bucketCount = 10;
    const buckets = new Array(bucketCount).fill(0);
    const bucketLabels = [];

    for (let i = 0; i < bucketCount; i++) {
      const lower = min + (range * i / bucketCount);
      const upper = min + (range * (i + 1) / bucketCount);
      bucketLabels.push(toolFormatZAR(Math.round(lower)) + ' - ' + toolFormatZAR(Math.round(upper)));
    }

    for (const val of outcomes) {
      const idx = Math.min(bucketCount - 1, Math.floor((val - min) / range * bucketCount));
      buckets[idx]++;
    }

    const totalPipelineValue = inputs.deals.reduce((sum, d) => sum + d.propertyValue, 0);
    const weightedCommission = Math.round(inputs.deals.reduce((sum, d) => sum + getDealCommission(d) * getDealProbability(d.stage), 0));

    return {
      worst: outcomes[Math.floor(0.05 * NUM_ITERATIONS)],
      likely: outcomes[Math.floor(0.50 * NUM_ITERATIONS)],
      best: outcomes[Math.floor(0.95 * NUM_ITERATIONS)],
      buckets,
      bucketLabels,
      outcomes,
      totalPipelineValue,
      weightedCommission,
      negativeRisk: outcomes[Math.floor(0.05 * NUM_ITERATIONS)] < 0,
      dealCount: inputs.deals.length,
      operatingCosts: inputs.operatingCosts,
      deals: inputs.deals.map(d => ({
        ...d,
        commission: getDealCommission(d),
        probability: getDealProbability(d.stage)
      }))
    };
  }

  // --- DOM: Boot Sequence ---

  function runBootSequence() {
    const line1 = document.getElementById('boot-line-1');
    const line2 = document.getElementById('boot-line-2');
    const line3 = document.getElementById('boot-line-3');
    const progress = document.getElementById('boot-progress');
    const status = document.getElementById('boot-status');

    toolTerminalType(line1, '> Loading Monte Carlo engine... OK', 20, () => {
      setTimeout(() => {
        toolTerminalType(line2, '> Fetching market probability models... OK', 20, () => {
          setTimeout(() => {
            toolTerminalType(line3, '> Initializing forecast pipeline... OK', 20, () => {
              progress.style.width = '100%';
              status.textContent = 'READY';
              setTimeout(() => {
                document.getElementById('btn-start').classList.remove('hidden');
              }, 400);
            });
          }, 200);
        });
      }, 200);
    });
  }

  // --- DOM: Event Wiring ---

  function wireDealEvents() {
    document.querySelectorAll('.deal-prop-val').forEach(el => {
      el.addEventListener('input', function () {
        const id = parseInt(this.dataset.dealId);
        const d = deals.find(x => x.id === id);
        if (d) d.propertyValue = parseInt(this.value);
        updateDealDisplay(id);
      });
    });

    document.querySelectorAll('.deal-rate').forEach(el => {
      el.addEventListener('input', function () {
        const id = parseInt(this.dataset.dealId);
        const d = deals.find(x => x.id === id);
        if (d) d.commissionRate = parseFloat(this.value);
        updateDealDisplay(id);
      });
    });

    document.querySelectorAll('.deal-stage').forEach(el => {
      el.addEventListener('change', function () {
        const id = parseInt(this.dataset.dealId);
        const d = deals.find(x => x.id === id);
        if (d) d.stage = this.value;
        updateDealDisplay(id);
      });
    });

    document.querySelectorAll('.remove-btn').forEach(el => {
      el.addEventListener('click', function () {
        const id = parseInt(this.dataset.dealId);
        deals = deals.filter(d => d.id !== id);
        updateDealCount();
        renderDeals();
      });
    });
  }

  function wireEvents() {
    document.getElementById('input-operatingCosts').addEventListener('input', function () {
      document.getElementById('val-operatingCosts').textContent = toolFormatZAR(parseInt(this.value));
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      showScreen('screen-input');
    });

    document.getElementById('btn-add-deal').addEventListener('click', () => {
      if (deals.length < 10) {
        deals.push(createDefaultDeal());
        renderDeals();
      }
    });

    document.getElementById('btn-forecast').addEventListener('click', () => {
      const inputs = getInputs();
      const { valid, errors } = validate(inputs);
      if (!valid) {
        alert(errors.join('\n'));
        return;
      }
      showScreen('screen-processing');
      runProcessing(inputs, (result) => {
        showScreen('screen-results');
        displayResults(result);
      });
    });

    document.getElementById('btn-gate').addEventListener('click', () => {
      if (!lastResult) return;
      toolShowEmailGate('commission-forecaster', {
        worst: lastResult.worst,
        likely: lastResult.likely,
        best: lastResult.best,
        totalPipelineValue: lastResult.totalPipelineValue,
        weightedCommission: lastResult.weightedCommission,
        operatingCosts: lastResult.operatingCosts,
        negativeRisk: lastResult.negativeRisk,
        dealCount: lastResult.dealCount,
        deals: lastResult.deals
      }, (email) => {
        document.getElementById('complete-email').textContent = email;
        showScreen('screen-complete');
      });
    });

    const restartButtons = [document.getElementById('btn-restart'), document.getElementById('btn-restart-complete')];
    restartButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        deals = [createDefaultDeal()];
        renderDeals();
        toolResetAndShowInput({
          'input-operatingCosts': 15000
        });
      });
    });
  }

  // --- Init ---

  function init() {
    deals = [createDefaultDeal()];
    renderDeals();
    wireEvents();
    runBootSequence();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
