[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  method = "POST,OPTIONS"
  force = true

# Optional: handle preflight
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  method = "OPTIONS"
  force = true
