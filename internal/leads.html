<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads - Zonke Internal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#0a0a0a',
            primary: '#c3f400',
            secondary: '#1478db',
            error: '#ff3b30',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: 'JetBrains Mono', monospace; }
    .card { background: #111; border: 1px solid #222; }
    .tab-active { border-bottom: 2px solid #c3f400; color: #c3f400; }
    .row-hover:hover { background: #1a1a1a; }
    textarea { background: #0a0a0a; border: 1px solid #333; color: #fff; font-family: 'JetBrains Mono', monospace; resize: vertical; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4">
    <div class="flex items-center justify-between">
      <div>
        <a href="/internal/dashboard.html" class="text-2xl font-bold text-primary">ZONKE</a>
        <span class="text-gray-500 text-sm ml-2">LEAD VIEWER</span>
      </div>
      <nav class="flex items-center gap-6">
        <a href="/internal/dashboard.html" class="text-gray-400 hover:text-white transition-colors">DASHBOARD</a>
        <a href="/internal/leads.html" class="text-primary hover:underline">LEADS</a>
        <button id="logoutBtn" class="text-gray-500 hover:text-error transition-colors">LOGOUT</button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="p-6">
    <!-- Tabs -->
    <div class="flex gap-4 mb-6 border-b border-gray-800">
      <button class="tab-btn tab-active pb-2 text-sm font-medium transition-colors" data-tab="audits">AUDITS</button>
      <button class="tab-btn pb-2 text-sm font-medium text-gray-500 hover:text-white transition-colors" data-tab="bookings">BOOKINGS</button>
      <button class="tab-btn pb-2 text-sm font-medium text-gray-500 hover:text-white transition-colors" data-tab="tools">TOOL SUBMISSIONS</button>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-4 mb-4">
      <input type="text" id="searchInput" placeholder="Search by email..." class="bg-surface border border-gray-700 px-3 py-2 text-sm focus:border-primary focus:outline-none w-64">
      <select id="filterVertical" class="bg-surface border border-gray-700 px-3 py-2 text-sm focus:border-primary focus:outline-none">
        <option value="">All Verticals</option>
        <option value="real_estate">Real Estate</option>
        <option value="tenders">Tenders</option>
      </select>
      <input type="date" id="filterDateFrom" class="bg-surface border border-gray-700 px-3 py-2 text-sm focus:border-primary focus:outline-none">
      <span class="text-gray-600 self-center">to</span>
      <input type="date" id="filterDateTo" class="bg-surface border border-gray-700 px-3 py-2 text-sm focus:border-primary focus:outline-none">
      <button id="clearFilters" class="text-gray-500 hover:text-white text-sm transition-colors">CLEAR</button>
    </div>

    <!-- Stats Bar -->
    <div class="flex gap-6 mb-4 text-sm">
      <span class="text-gray-500">Showing <span id="shownCount" class="text-primary">0</span> of <span id="totalCount" class="text-white">0</span> records</span>
    </div>

    <!-- Table -->
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr id="tableHeader" class="text-left text-gray-500 bg-black/50">
              <!-- Dynamic headers -->
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="10" class="py-8 text-center text-gray-500">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-800">
        <div class="text-sm text-gray-500">
          Page <span id="currentPage" class="text-white">1</span> of <span id="totalPages" class="text-white">1</span>
        </div>
        <div class="flex gap-2">
          <button id="prevBtn" class="px-3 py-1 bg-gray-800 text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-700 transition-colors" disabled>PREV</button>
          <button id="nextBtn" class="px-3 py-1 bg-gray-800 text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-700 transition-colors" disabled>NEXT</button>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
      <div class="card max-w-2xl w-full max-h-[80vh] overflow-y-auto">
        <div class="flex items-center justify-between p-4 border-b border-gray-800">
          <h3 id="modalTitle" class="font-bold">Details</h3>
          <button id="closeModal" class="text-gray-500 hover:text-white">&times;</button>
        </div>
        <div id="modalContent" class="p-4 space-y-3">
          <!-- Dynamic content -->
        </div>
      </div>
    </div>
  </main>

  <script>
    // Auth check
    if (!sessionStorage.getItem('zonke_auth')) {
      window.location.href = '/internal/index.html';
    }

    // State
    let currentTab = 'audits';
    let currentPage = 1;
    const perPage = 20;
    let allData = [];
    let filteredData = [];

    const tableConfigs = {
      audits: {
        headers: ['Email', 'Company', 'Vertical', 'Status', 'Date', ''],
        render: (row) => `
          <td class="py-3 px-4 text-gray-300">${row.email}</td>
          <td class="py-3 px-4 text-gray-500">${row.company || '-'}</td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 text-xs rounded ${row.vertical === 'real_estate' ? 'bg-secondary/20 text-secondary' : 'bg-primary/20 text-primary'}">${row.vertical.replace('_', ' ')}</span></td>
          <td class="py-3 px-4 text-gray-500">${row.status}</td>
          <td class="py-3 px-4 text-gray-500">${new Date(row.created_at).toLocaleDateString()}</td>
          <td class="py-3 px-4"><button class="view-btn text-primary hover:underline text-xs" data-id="${row.id}">VIEW</button></td>
        `,
        modalTitle: (row) => `Audit: ${row.email}`,
        modalContent: (row) => `
          <div><span class="text-gray-500">Email:</span> <span class="text-white">${row.email}</span></div>
          <div><span class="text-gray-500">Company:</span> <span class="text-white">${row.company || '-'}</span></div>
          <div><span class="text-gray-500">Vertical:</span> <span class="text-white">${row.vertical}</span></div>
          <div><span class="text-gray-500">Status:</span> <span class="text-white">${row.status}</span></div>
          <div><span class="text-gray-500">Created:</span> <span class="text-white">${new Date(row.created_at).toLocaleString()}</span></div>
        `
      },
      bookings: {
        headers: ['Name', 'Email', 'Preferred Date', 'Message', 'Date', ''],
        render: (row) => `
          <td class="py-3 px-4 text-gray-300">${row.name}</td>
          <td class="py-3 px-4 text-gray-300">${row.email}</td>
          <td class="py-3 px-4 text-gray-500">${row.preferred_date ? new Date(row.preferred_date).toLocaleDateString() : '-'}</td>
          <td class="py-3 px-4 text-gray-500 truncate max-w-xs">${row.message || '-'}</td>
          <td class="py-3 px-4 text-gray-500">${new Date(row.created_at).toLocaleDateString()}</td>
          <td class="py-3 px-4"><button class="view-btn text-primary hover:underline text-xs" data-id="${row.id}">VIEW</button></td>
        `,
        modalTitle: (row) => `Booking: ${row.name}`,
        modalContent: (row) => `
          <div><span class="text-gray-500">Name:</span> <span class="text-white">${row.name}</span></div>
          <div><span class="text-gray-500">Email:</span> <span class="text-white">${row.email}</span></div>
          <div><span class="text-gray-500">Preferred Date:</span> <span class="text-white">${row.preferred_date ? new Date(row.preferred_date).toLocaleString() : '-'}</span></div>
          <div><span class="text-gray-500">Message:</span></div>
          <textarea class="w-full h-24 p-2 mt-1" readonly>${row.message || '-'}</textarea>
          <div><span class="text-gray-500">Created:</span> <span class="text-white">${new Date(row.created_at).toLocaleString()}</span></div>
        `
      },
      tools: {
        headers: ['Email', 'Tool', 'Score', 'Date', ''],
        render: (row) => `
          <td class="py-3 px-4 text-gray-300">${row.email}</td>
          <td class="py-3 px-4 text-primary">${row.tool_id.replace(/-/g, ' ')}</td>
          <td class="py-3 px-4 text-gray-300">${row.score ? row.score + '%' : '-'}</td>
          <td class="py-3 px-4 text-gray-500">${new Date(row.created_at).toLocaleDateString()}</td>
          <td class="py-3 px-4"><button class="view-btn text-primary hover:underline text-xs" data-id="${row.id}">VIEW</button></td>
        `,
        modalTitle: (row) => `Tool Submission: ${row.tool_id}`,
        modalContent: (row) => `
          <div><span class="text-gray-500">Email:</span> <span class="text-white">${row.email}</span></div>
          <div><span class="text-gray-500">Tool:</span> <span class="text-primary">${row.tool_id}</span></div>
          <div><span class="text-gray-500">Score:</span> <span class="text-white">${row.score ? row.score + '%' : '-'}</span></div>
          <div><span class="text-gray-500">Status:</span> <span class="text-white">${row.status}</span></div>
          <div><span class="text-gray-500">Results:</span></div>
          <textarea class="w-full h-48 p-2 mt-1" readonly>${JSON.stringify(row.results, null, 2)}</textarea>
          <div><span class="text-gray-500">Created:</span> <span class="text-white">${new Date(row.created_at).toLocaleString()}</span></div>
        `
      }
    };

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('zonke_auth');
      window.location.href = '/internal/index.html';
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
        btn.classList.add('tab-active');
        currentTab = btn.dataset.tab;
        currentPage = 1;
        loadData();
      });
    });

    // Filters
    const searchInput = document.getElementById('searchInput');
    const filterVertical = document.getElementById('filterVertical');
    const filterDateFrom = document.getElementById('filterDateFrom');
    const filterDateTo = document.getElementById('filterDateTo');
    const clearFilters = document.getElementById('clearFilters');

    let filterTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(applyFilters, 300);
    });
    filterVertical.addEventListener('change', applyFilters);
    filterDateFrom.addEventListener('change', applyFilters);
    filterDateTo.addEventListener('change', applyFilters);
    clearFilters.addEventListener('click', () => {
      searchInput.value = '';
      filterVertical.value = '';
      filterDateFrom.value = '';
      filterDateTo.value = '';
      applyFilters();
    });

    function applyFilters() {
      const search = searchInput.value.toLowerCase();
      const vertical = filterVertical.value;
      const dateFrom = filterDateFrom.value ? new Date(filterDateFrom.value) : null;
      const dateTo = filterDateTo.value ? new Date(filterDateTo.value + 'T23:59:59') : null;

      filteredData = allData.filter(row => {
        const matchSearch = !search || row.email?.toLowerCase().includes(search) || row.name?.toLowerCase().includes(search);
        const matchVertical = !vertical || row.vertical === vertical;
        const created = new Date(row.created_at);
        const matchDate = (!dateFrom || created >= dateFrom) && (!dateTo || created <= dateTo);
        return matchSearch && matchVertical && matchDate;
      });

      currentPage = 1;
      renderTable();
    }

    // Pagination
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      const totalPages = Math.ceil(filteredData.length / perPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    });

    // Modal
    const detailModal = document.getElementById('detailModal');
    document.getElementById('closeModal').addEventListener('click', () => detailModal.classList.add('hidden'));
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) detailModal.classList.add('hidden');
    });

    async function loadData() {
      const endpoint = currentTab === 'audits' ? 'audits' : currentTab === 'bookings' ? 'bookings' : 'tool-submissions';
      try {
        const res = await fetch(`/api/internal/${endpoint}`, {
          headers: { 'X-Auth': '1' }
        });
        allData = await res.json();
        allData.reverse(); // Newest first
        applyFilters();
      } catch (err) {
        console.error('Failed to load:', err);
      }
    }

    function renderTable() {
      const config = tableConfigs[currentTab];
      const totalPages = Math.ceil(filteredData.length / perPage);
      const start = (currentPage - 1) * perPage;
      const pageData = filteredData.slice(start, start + perPage);

      // Header
      document.getElementById('tableHeader').innerHTML = config.headers.map(h => 
        `<th class="py-3 px-4 font-medium">${h}</th>`
      ).join('');

      // Body
      if (pageData.length === 0) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="${config.headers.length}" class="py-8 text-center text-gray-500">No records found</td></tr>`;
      } else {
        document.getElementById('tableBody').innerHTML = pageData.map((row, i) => `
          <tr class="row-hover border-b border-gray-800/50" data-row-index="${start + i}">
            ${config.render(row)}
          </tr>
        `).join('');
      }

      // Stats
      document.getElementById('shownCount').textContent = filteredData.length;
      document.getElementById('totalCount').textContent = allData.length;
      document.getElementById('currentPage').textContent = currentPage;
      document.getElementById('totalPages').textContent = totalPages || 1;

      // Buttons
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;

      // View buttons
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.closest('tr').dataset.rowIndex);
          const row = filteredData[idx];
          document.getElementById('modalTitle').textContent = config.modalTitle(row);
          document.getElementById('modalContent').innerHTML = config.modalContent(row);
          detailModal.classList.remove('hidden');
          detailModal.classList.add('flex');
        });
      });
    }

    loadData();
  </script>
</body>
</html>
