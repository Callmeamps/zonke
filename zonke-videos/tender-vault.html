<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender Vault</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121414;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      position: relative;
      background: #121414;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }
    
    /* Scene 1: Radar */
    .radar {
      width: 300px;
      height: 300px;
      border: 2px solid #c3f400;
      border-radius: 50%;
      position: relative;
    }
    .radar-ring {
      position: absolute;
      border: 1px solid rgba(195, 244, 0, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .radar-ring:nth-child(1) { width: 100px; height: 100px; }
    .radar-ring:nth-child(2) { width: 200px; height: 200px; }
    .radar-sweep {
      position: absolute;
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, #c3f400, transparent);
      top: 50%;
      left: 50%;
      transform-origin: left center;
    }
    .radar-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #c3f400;
      border-radius: 50%;
      opacity: 0;
    }
    .radar-label {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: #c3f400;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    
    /* Scene 2: List */
    .list-container {
      width: 400px;
    }
    .list-title {
      color: #c3f400;
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .list-item {
      color: #555;
      font-size: 14px;
      padding: 12px 16px;
      border-left: 2px solid #333;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    .list-item.active {
      color: #c3f400;
      border-left-color: #c3f400;
      background: rgba(195, 244, 0, 0.05);
    }
    
    /* Scene 3: Scan Button */
    .scan-container {
      text-align: center;
    }
    .scan-button {
      width: 160px;
      height: 160px;
      border: 3px solid #c3f400;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .scan-button::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 4px;
      background: #c3f400;
      top: 0;
      transform: translateY(-100%);
    }
    .scan-icon {
      width: 60px;
      height: 60px;
      border: 3px solid #c3f400;
      position: relative;
    }
    .scan-icon::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #c3f400;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .scan-label {
      color: #c3f400;
      font-size: 16px;
      letter-spacing: 4px;
      margin-top: 30px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Scene 1: Radar -->
    <div class="scene scene-1">
      <div class="radar">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-sweep"></div>
        <div class="radar-dot" style="top: 30%; left: 60%"></div>
        <div class="radar-dot" style="top: 70%; left: 35%"></div>
        <div class="radar-dot" style="top: 45%; left: 75%"></div>
        <div class="radar-label">Scanning</div>
      </div>
    </div>
    
    <!-- Scene 2: List -->
    <div class="scene scene-2">
      <div class="list-container">
        <div class="list-title">Detected</div>
        <div class="list-item">Tender_001.dat</div>
        <div class="list-item">Tender_002.dat</div>
        <div class="list-item">Tender_003.dat</div>
        <div class="list-item">Tender_004.dat</div>
        <div class="list-item">Tender_005.dat</div>
      </div>
    </div>
    
    <!-- Scene 3: Scan Button -->
    <div class="scene scene-3">
      <div class="scan-container">
        <div class="scan-button">
          <div class="scan-icon"></div>
        </div>
        <div class="scan-label">Initialize</div>
      </div>
    </div>
  </div>

  <script>
    const lime = '#c3f400';
    const tl = gsap.timeline({ repeat: -1 });
    
    // Scene 1: Radar Sweep (0-10s)
    tl.to('.scene-1', { opacity: 1, duration: 0.5 })
      .to('.radar-sweep', { 
        rotation: 360, 
        duration: 4, 
        ease: 'none' 
      }, 0)
      .to('.radar-dot', { 
        opacity: 1, 
        scale: 1.5, 
        duration: 0.3,
        stagger: 0.8
      }, 1)
      .to('.radar-dot', { 
        opacity: 0, 
        scale: 0.5, 
        duration: 0.3 
      }, '+=0.2')
      .to('.scene-1', { opacity: 0, duration: 0.5 }, '+=0.5');
    
    // Scene 2: List Highlight (10-20s)
    tl.to('.scene-2', { opacity: 1, duration: 0.5 }, '+=0')
      .from('.list-item', { 
        x: -20, 
        opacity: 0, 
        duration: 0.3, 
        stagger: 0.15 
      }, '+=0')
      .to('.list-item:nth-child(2)', { 
        color: lime, 
        borderColor: lime, 
        backgroundColor: 'rgba(195, 244, 0, 0.1)',
        duration: 0.3 
      }, '+=0.5')
      .to('.list-item:nth-child(3)', { 
        color: lime, 
        borderColor: lime, 
        backgroundColor: 'rgba(195, 244, 0, 0.1)',
        duration: 0.3 
      }, '+=0.3')
      .to('.list-item:nth-child(4)', { 
        color: lime, 
        borderColor: lime, 
        backgroundColor: 'rgba(195, 244, 0, 0.1)',
        duration: 0.3 
      }, '+=0.3')
      .to('.list-item:nth-child(5)', { 
        color: lime, 
        borderColor: lime, 
        backgroundColor: 'rgba(195, 244, 0, 0.1)',
        duration: 0.3 
      }, '+=0.3')
      .to('.list-item:nth-child(6)', { 
        color: lime, 
        borderColor: lime, 
        backgroundColor: 'rgba(195, 244, 0, 0.1)',
        duration: 0.3 
      }, '+=0.3')
      .to('.scene-2', { opacity: 0, duration: 0.5 }, '+=0.5');
    
    // Scene 3: Scan Button (20-30s)
    tl.to('.scene-3', { opacity: 1, duration: 0.5 }, '+=0')
      .from('.scan-button', { 
        scale: 0, 
        rotation: -180,
        duration: 0.8, 
        ease: 'back.out(1.7)' 
      }, '+=0')
      .from('.scan-label', { 
        y: 20, 
        opacity: 0, 
        duration: 0.5 
      }, '+=0.2')
      .to('.scan-button::before', { 
        transform: 'translateY(400%)', 
        duration: 1.5, 
        ease: 'power2.inOut' 
      }, '+=0.5')
      .to('.scan-button', { 
        boxShadow: `0 0 30px ${lime}`, 
        duration: 0.3 
      }, '+=0')
      .to('.scan-button', { 
        boxShadow: `0 0 60px ${lime}`, 
        duration: 0.5 
      }, '+=0.3')
      .to('.scan-button', { 
        boxShadow: `0 0 0px ${lime}`, 
        duration: 0.5 
      }, '+=0.5');
  </script>
</body>
</html>
